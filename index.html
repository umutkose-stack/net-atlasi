<style>
/* Layout: sabit sol kenar çubuğu + geniş çalışma alanı; telefonda üst çubuk + çekmece. Topografik atlas çizgileri yalnızca markada. */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --sunk:#eaeeec; --line:#dbe2df; --line-2:#c7d1cd;
  --fg:#16211e; --muted:#5d6b66; --faint:#8b9894;
  --ink:#16443a; --ink-fg:#ffffff; --ink-soft:#e1ece8; --ink-text:#1d5a4c;
  --gold:#b07a12; --gold-soft:#f6ecd6;
  --up:#1f7a4d; --up-soft:#e2f2e9; --down:#b4442c; --down-soft:#f8e5df;
  --c-tr:#2f6fb5; --c-mat:#7b55c4; --c-sos:#c47a1f; --c-fen:#2b9a74; --c-ink:#c2453a; --c-din:#8a6a3c; --c-ing:#c24b8f; --c-total:#16443a;
  --shadow:0 1px 2px rgba(22,33,30,.05),0 6px 24px -12px rgba(22,33,30,.18);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#161e1b; --sunk:#1c2622; --line:#26322e; --line-2:#33423d;
  --fg:#e6eeeb; --muted:#9aaba5; --faint:#6d7d77;
  --ink:#5fc2a5; --ink-fg:#08130f; --ink-soft:#1c332c; --ink-text:#8fd8c2;
  --gold:#e3b04f; --gold-soft:#3a2f17;
  --up:#5cc88f; --up-soft:#173225; --down:#ee8a72; --down-soft:#3a1f19;
  --c-tr:#6fa8ea; --c-mat:#ad8cf0; --c-sos:#e7a456; --c-fen:#57c9a0; --c-ink:#ef7d70; --c-din:#c6a173; --c-ing:#ec84bd; --c-total:#7fd8bd;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#161e1b; --sunk:#1c2622; --line:#26322e; --line-2:#33423d;
  --fg:#e6eeeb; --muted:#9aaba5; --faint:#6d7d77;
  --ink:#5fc2a5; --ink-fg:#08130f; --ink-soft:#1c332c; --ink-text:#8fd8c2;
  --gold:#e3b04f; --gold-soft:#3a2f17;
  --up:#5cc88f; --up-soft:#173225; --down:#ee8a72; --down-soft:#3a1f19;
  --c-tr:#6fa8ea; --c-mat:#ad8cf0; --c-sos:#e7a456; --c-fen:#57c9a0; --c-ink:#ef7d70; --c-din:#c6a173; --c-ing:#ec84bd; --c-total:#7fd8bd;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 14px max(14px,env(safe-area-inset-left,0px));gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:26px;height:26px}
.brand b{font-family:var(--f-display);font-size:21px;letter-spacing:-.02em;display:block;line-height:1}
.brand small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--ink-soft);color:var(--ink-text);font-weight:600}
.nav .count{margin-left:auto;font-size:12px;background:var(--sunk);padding:1px 7px;border-radius:99px;color:var(--muted)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-head{display:flex;align-items:center;justify-content:space-between}
.icon-btn{border:0;background:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--fg)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--bg)}
.search input{border:0;background:none;outline:0;width:100%;font-size:13.5px;min-width:0}
.slist{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:60px;flex:1}
.sitem{display:flex;gap:10px;align-items:center;border:0;background:none;padding:7px 8px;border-radius:9px;text-align:left;width:100%}
.sitem:hover{background:var(--sunk)}
.sitem[aria-current="true"]{background:var(--sunk);box-shadow:inset 2px 0 0 var(--ink)}
.av{width:32px;height:32px;border-radius:50%;background:var(--ink-soft);color:var(--ink-text);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.sitem .meta{min-width:0}
.sitem .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .sub{font-size:12px;color:var(--muted)}
.side-foot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.savenote{display:flex;gap:9px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px;font-size:12.5px;color:var(--muted)}
.savenote b{color:var(--fg);font-weight:600;display:block}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;margin-top:6px}
.dot.ok{background:var(--up)} .dot.warn{background:var(--gold)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.crumb{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0}
.crumb b{color:var(--fg);font-weight:600}
.top .spacer{flex:1}
.today{font-size:13px;color:var(--muted)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:250px;z-index:20;display:flex;flex-direction:column}
.menu button,.menu label{display:flex;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;font-size:14px;cursor:pointer}
.menu button:hover,.menu label:hover{background:var(--sunk)}
.menu small{display:block;color:var(--muted);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.content{padding-block:26px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.2vw,34px);letter-spacing:-.025em;margin:2px 0 4px;line-height:1.1;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.015em;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0}
.head-row{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink);color:var(--ink-text)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);padding:10px 18px}
.btn.primary:hover{filter:brightness(1.08);color:var(--ink-fg)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.quiet:hover{color:var(--ink-text);background:var(--sunk)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.seg{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink-text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.typebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.typebar .hint{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.student-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.student-bar .av{width:46px;height:46px;font-size:17px}
.student-bar .who{min-width:0;flex:1}
.student-bar .who .n{font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.student-bar .who .s{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.linkish{border:0;background:none;padding:0;color:var(--ink-text);font-size:13px;text-decoration:underline dotted;text-underline-offset:3px}
.pick{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--panel);font-size:14px;max-width:200px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .k{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.kpi .v small{font-family:var(--f-body);font-size:13px;color:var(--faint);font-weight:500;margin-left:4px;letter-spacing:0}
.kpi .f{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:20px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up)} .chip.down{background:var(--down-soft);color:var(--down)} .chip.flat{background:var(--sunk);color:var(--muted)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.kico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:2px}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px}
.grid2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.legend button[aria-pressed="true"]{background:var(--sunk);color:var(--fg);border-color:var(--line-2)}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--faint);font-family:var(--f-mono);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;min-width:170px;transform:translate(-50%,calc(-100% - 12px));z-index:4}
.tip b{display:block;font-size:13.5px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r span:first-child{display:flex;align-items:center;gap:6px;color:var(--muted)}
.foot-note{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:8px}
.subjects{display:flex;flex-direction:column}
.subj{display:grid;grid-template-columns:38px minmax(0,1fr) 80px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.subj:last-child{border-bottom:0}
.tag{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em}
.subj .nm{font-weight:600;font-size:14px}
.subj .av2{font-size:13px;color:var(--muted)}
.subj .av2 b{font-family:var(--f-display);font-size:17px;color:var(--fg);margin-right:4px}
.subj .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
/* table */
.tbl-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;margin:14px -20px -18px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 14px;background:var(--sunk);white-space:nowrap;vertical-align:bottom}
th:first-child,td:first-child{text-align:left;padding-left:20px}
th small{display:block;font-weight:400;color:var(--faint);font-size:11px}
th .sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
td{padding:11px 14px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
td.tot,th.tot{background:color-mix(in srgb,var(--ink-soft) 60%,transparent);font-weight:700;color:var(--ink-text)}
td.ex{display:flex;gap:12px;align-items:center;min-width:220px}
.idx{font-family:var(--f-mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:2px 5px}
.ex .nm{font-weight:600;white-space:normal}
.ex .dt{font-size:12.5px;color:var(--muted)}
.dyn{display:inline-grid;grid-template-columns:auto auto auto;gap:0 8px;font-size:12.5px;text-align:right}
.dyn .d{color:var(--up)} .dyn .y{color:var(--down)} .dyn .n{font-weight:700}
.dyn .h{font-size:10px;color:var(--faint)}
.subcell{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.subcell .sl{font-size:10.5px;color:var(--faint)}
.acts{display:flex;gap:2px;justify-content:flex-end}
tfoot td{background:var(--sunk);font-weight:700;font-size:13px}
.ovr{font-size:10px;color:var(--gold);margin-left:3px;vertical-align:super}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin:0 -20px -18px}
.empty{padding:44px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;font-family:var(--f-display);color:var(--fg);font-size:18px}
/* students page */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.scard{padding:18px;display:flex;flex-direction:column;gap:12px}
.scard .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.scard .av{width:42px;height:42px;font-size:15px}
.scard .n{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.scard .lv{font-size:12.5px;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 span{font-size:11.5px;color:var(--muted);display:block}
.stats3 b{font-family:var(--f-display);font-size:20px;font-weight:700}
.scard .go{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--ink-text);font-weight:600;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.scard.add{border-style:dashed;background:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);min-height:200px}
.spark{display:block}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.modal.small{width:min(460px,100%)}
.m-h{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px 14px;border-bottom:1px solid var(--line);gap:12px}
.m-h h2{font-size:20px}
.m-h p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.m-b{padding:18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.m-f{display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:var(--sunk);flex-wrap:wrap}
.m-f .sum{margin-right:auto;font-size:13px;color:var(--muted)}
.m-f .sum b{font-family:var(--f-display);font-size:22px;color:var(--fg);margin-right:4px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:600}
.fld label small{font-weight:400;color:var(--faint);margin-left:4px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;background:var(--panel);width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);color:color-mix(in srgb,var(--gold) 70%,var(--fg));border-radius:10px;padding:9px 12px;font-size:13px}
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sec{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--sunk);font-weight:700;font-size:14px;gap:8px}
.sec-h .nt{font-size:13px;font-weight:600;color:var(--muted)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
"use strict";
/* ---------- sınav şablonları ---------- */
const TYPES={
  TYT:{label:"TYT",div:4,secs:[
    {key:"turkce",name:"Türkçe",tag:"TR",color:"--c-tr",subs:[{key:"turkce",name:"Türkçe",max:40}]},
    {key:"matematik",name:"Matematik",tag:"MAT",color:"--c-mat",subs:[{key:"matematik",name:"Matematik",max:30},{key:"geometri",name:"Geometri",max:10}]},
    {key:"sosyal",name:"Sosyal",tag:"SOS",color:"--c-sos",subs:[{key:"inkilap",name:"Tarih",max:5},{key:"cografya",name:"Coğrafya",max:5},{key:"felsefe",name:"Felsefe",max:5},{key:"din",name:"Din Kültürü",max:5}]},
    {key:"fen",name:"Fen",tag:"FEN",color:"--c-fen",subs:[{key:"fizik",name:"Fizik",max:7},{key:"kimya",name:"Kimya",max:7},{key:"biyoloji",name:"Biyoloji",max:6}]}]},
  LGS:{label:"LGS",div:3,secs:[
    {key:"turkce",name:"Türkçe",tag:"TR",color:"--c-tr",subs:[{key:"lgs_turkce",name:"Türkçe",max:20}]},
    {key:"matematik",name:"Matematik",tag:"MAT",color:"--c-mat",subs:[{key:"lgs_matematik",name:"Matematik",max:20}]},
    {key:"fen",name:"Fen Bilimleri",tag:"FEN",color:"--c-fen",subs:[{key:"lgs_fen",name:"Fen Bilimleri",max:20}]},
    {key:"inkilap",name:"İnkılap Tarihi",tag:"İNK",color:"--c-ink",subs:[{key:"lgs_inkilap",name:"T.C. İnkılap Tarihi",max:10}]},
    {key:"din",name:"Din Kültürü",tag:"DİN",color:"--c-din",subs:[{key:"lgs_din",name:"Din Kültürü",max:10}]},
    {key:"ingilizce",name:"İngilizce",tag:"İNG",color:"--c-ing",subs:[{key:"lgs_ingilizce",name:"İngilizce",max:10}]}]},
  AYT:{label:"AYT",div:4,secs:[
    {key:"matematik",name:"Matematik",tag:"MAT",color:"--c-mat",subs:[{key:"ayt_mat",name:"Matematik",max:40}]},
    {key:"edsos1",name:"Edebiyat–Sos. 1",tag:"EDB",color:"--c-tr",subs:[{key:"edebiyat",name:"Edebiyat",max:24},{key:"tarih1",name:"Tarih-1",max:10},{key:"cografya1",name:"Coğrafya-1",max:6}]},
    {key:"sos2",name:"Sosyal-2",tag:"SS2",color:"--c-sos",subs:[{key:"tarih2",name:"Tarih-2",max:11},{key:"cografya2",name:"Coğrafya-2",max:11},{key:"ayt_felsefe",name:"Felsefe Grubu",max:12},{key:"ayt_din",name:"Din Kültürü",max:6}]},
    {key:"fen",name:"Fen",tag:"FEN",color:"--c-fen",subs:[{key:"ayt_fizik",name:"Fizik",max:14},{key:"ayt_kimya",name:"Kimya",max:13},{key:"ayt_biyoloji",name:"Biyoloji",max:13}]}]}
};
const DIV_LABEL={4:"4 yanlış → 1 doğru",3:"3 yanlış → 1 doğru",0:"Yanlış etkilemez"};
const TRACKS={YKS:{label:"YKS (TYT + AYT)",types:["TYT","AYT"]},LGS:{label:"LGS",types:["LGS"]}};
const trackOf=s=>TRACKS[s?.track]?s.track:"YKS";
const typesOf=s=>TRACKS[trackOf(s)].types;
function fitType(s){const ts=typesOf(s);if(ts.includes(UI.type))return;const pt=s?primaryType(s.id):null;UI.type=ts.includes(pt)?pt:ts[0]}

/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round(n*100)/100;
const fmt=n=>n==null||isNaN(n)?"—":r2(n).toLocaleString("tr-TR",{maximumFractionDigits:2});
const signed=n=>(n>0?"+":"")+fmt(n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const initials=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toLocaleUpperCase("tr-TR");
const MONTHS=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const fdate=d=>{if(!d)return "Tarih yok";const [y,m,dd]=d.split("-").map(Number);return `${dd} ${MONTHS[m-1]} ${y}`};
const isoToday=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const isNum=v=>v!==null&&v!==undefined&&v!==""&&!isNaN(+v);

function subNet(r,div){if(!r||(!isNum(r.c)&&!isNum(r.w)))return null;const c=+r.c||0,w=+r.w||0;return c-(div?w/div:0)}
function secNet(ex,sec){const o=ex.overrides?.[sec.key];if(isNum(o))return +o;let any=false,s=0;for(const sb of sec.subs){const n=subNet(ex.results?.[sb.key],ex.divisor);if(n!=null){any=true;s+=n}}return any?s:null}
function secCW(ex,sec){let c=null,w=null;for(const sb of sec.subs){const r=ex.results?.[sb.key];if(r&&isNum(r.c))c=(c||0)+ +r.c;if(r&&isNum(r.w))w=(w||0)+ +r.w}return{c,w}}
function overLimit(ex){const t=TYPES[ex.type];if(!t)return "";const out=[];for(const sc of t.secs)for(const sb of sc.subs){const r=ex.results?.[sb.key];if(r&&(+r.c||0)+(+r.w||0)>sb.max)out.push(`${sb.name} ${(+r.c||0)+(+r.w||0)}/${sb.max}`)}return out.join(", ")}
function totalNet(ex){const t=TYPES[ex.type]||TYPES.TYT;let any=false,s=0;for(const sec of t.secs){const n=secNet(ex,sec);if(n!=null){any=true;s+=n}}return any?s:null}
function missingSubs(ex){const t=TYPES[ex.type]||TYPES.TYT;return t.secs.some(sec=>!isNum(ex.overrides?.[sec.key])&&sec.subs.some(sb=>{const r=ex.results?.[sb.key];return !r||!isNum(r.c)||!isNum(r.w)}))}
function sortExams(list,mode){const a=[...list];const key=e=>e.date||"9999";
  if(mode==="added")a.sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));
  else{a.sort((x,y)=>key(x).localeCompare(key(y))||(x.createdAt||0)-(y.createdAt||0));if(mode==="desc"){const dated=a.filter(e=>e.date).reverse();a.splice(0,a.length,...dated,...a.filter(e=>!e.date))}}
  return a}
function chrono(list){return sortExams(list,"asc")}

/* ---------- durum ---------- */
const S={students:new Map(),exams:new Map(),ready:false,mode:"loading"};
const UI={view:ls.get("na-view","overview"),sid:ls.get("na-sid",null),type:ls.get("na-type","TYT"),sort:ls.get("na-sort","asc"),dyn:false,q:"",sq:"",series:{total:true},tq:"",tStudent:"all",tType:ls.get("na-ttype","TYT"),confirm:null,menu:null};
let db=null,dl=null,user=null,ROLE="teacher",ME=null,WHO="Öğrenci";
const PORTAL=new Map();let portalLoaded=false,syncT=null;

/* ---------- depo ---------- */
const LOCAL="na-local-v1";
function localLoad(){const d=ls.get(LOCAL,{students:{},exams:{}});S.students=new Map(Object.entries(d.students));S.exams=new Map(Object.entries(d.exams))}
function localSave(){ls.set(LOCAL,{students:Object.fromEntries(S.students),exams:Object.fromEntries(S.exams)})}
async function put(coll,id,data){
  const m=coll==="students"?S.students:S.exams;m.set(id,{...data,id});render();
  if(db){try{const body={...data};delete body.id;await db.collection(coll).doc(id).set(body)}catch(e){handleWriteErr(e);throw e}}
  else localSave()}
async function del(coll,id){
  (coll==="students"?S.students:S.exams).delete(id);render();
  if(db){try{await db.collection(coll).doc(id).delete()}catch(e){handleWriteErr(e);throw e}}else localSave()}
function handleWriteErr(e){toast(e?.code==="quota_exceeded"?"Kayıt alanı doldu. Eski denemeleri silip yeniden dene.":e?.code==="invalid_argument"?"Bu sayfada değişiklik yapma iznin yok.":"Kaydedilemedi. Bağlantını kontrol edip tekrar dene.")}
function setSave(state){
  const d=$("#saveDot"),t=$("#saveTitle"),x=$("#saveText");
  d.className="dot"+(state==="ok"?" ok":state==="warn"||state==="local"?" warn":"");
  if(state==="ok"){t.textContent="Gelişim kaybolmasın.";x.textContent="Kayıtlar hesabında saklanır."}
  else if(state==="local"){t.textContent="Yalnızca bu tarayıcıda";x.textContent="Kalıcı kayıt alanına ulaşılamadı; yedek indirmeyi unutma."}
  else if(state==="warn"){t.textContent="Bağlantı yavaş";x.textContent="Kayıtlar henüz gelmedi; gösterilen veri eski olabilir."}
  else{t.textContent="Bağlanıyor…";x.textContent="Kayıtlar yükleniyor."}}
async function boot(){
  if(window.NA_STATIC)return bootStatic();
  render();
  try{db=window.claude?.use?await window.claude.use("db"):null}catch{db=null}
  try{dl=window.claude?.use?await window.claude.use("downloads"):null}catch{dl=null}
  try{user=window.claude?.use?await window.claude.use("user"):null}catch{user=null}
  if(user){let ed=false;try{ed=await user.canEdit()}catch{}if(!ed){ROLE="student";try{ME=await user.id()}catch{ME=null}}}
  if(ROLE==="student")return bootStudent();
  if(!db){localLoad();S.ready=true;S.mode="local";setSave("local");render();return}
  db.collection("portal").onSnapshot(snap=>{PORTAL.clear();snap.docs.forEach(d=>PORTAL.set(d.id,d.data()));if(!snap.metadata.fromCache)portalLoaded=true;scheduleSync()},()=>{});
  let got={students:false,exams:false};
  const timer=setTimeout(()=>{if(!(got.students&&got.exams))setSave("warn")},10000);
  const sub=(coll,map)=>db.collection(coll).onSnapshot(snap=>{
      map.clear();snap.docs.forEach(d=>map.set(d.id,{...d.data(),id:d.id}));
      if(!snap.metadata.fromCache)got[coll]=true;
      if(got.students&&got.exams){clearTimeout(timer);S.ready=true;S.mode="db";setSave("ok");scheduleSync()}
      else if(map.size)S.ready=true;
      render()},
    err=>{clearTimeout(timer);S.ready=true;setSave("warn");toast("Kayıtlara ulaşılamadı.");render()});
  sub("students",S.students);sub("exams",S.exams)}

/* ---------- öğrenci erişimi ---------- */
const CODE_RE=/^[A-Za-z0-9_\-.~:@+]{4,200}$/;
function codesOf(s){const a=Array.isArray(s?.access)?s.access.filter(x=>x&&CODE_RE.test(x.code)):[];if(s?.portalId&&CODE_RE.test(s.portalId)&&!a.some(x=>x.code===s.portalId))a.unshift({code:s.portalId,who:"Öğrenci"});return a}
function portalPayload(s,who){const {id,name,level,track,targets}=s;
  const exams=examsOf(s.id).sort((a,b)=>a.id.localeCompare(b.id)).map(e=>{const {studentId,...rest}=e;return rest});
  return {who,student:{id,name,level:level||"",track:trackOf(s),targets:targets||{}},exams}}
function scheduleSync(){if(ROLE!=="teacher"||!db)return;clearTimeout(syncT);syncT=setTimeout(syncPortal,700)}
async function syncPortal(){
  if(!(S.mode==="db"&&portalLoaded))return;
  const linked=new Map();for(const s of S.students.values())for(const a of codesOf(s))linked.set(a.code,{s,who:a.who});
  for(const [code,{s,who}] of linked){const p=portalPayload(s,who);const cur=PORTAL.get(code);
    if(cur&&JSON.stringify({who:cur.who,student:cur.student,exams:cur.exams})===JSON.stringify(p))continue;
    try{await db.collection("portal").doc(code).set({...p,syncedAt:Date.now()})}catch(e){console.warn("portal",e)}}

const enc=new TextEncoder(),dec=new TextDecoder();
const toB64=buf=>{let b="";new Uint8Array(buf).forEach(x=>b+=String.fromCharCode(x));return btoa(b)};
const fromB64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
const normUser=u=>String(u||"").trim().toLocaleLowerCase("tr-TR");
async function entryKey(u){const h=await crypto.subtle.digest("SHA-256",enc.encode("net-atlasi:"+normUser(u)));return [...new Uint8Array(h)].slice(0,12).map(x=>x.toString(16).padStart(2,"0")).join("")}
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey("raw",enc.encode(String(pass).trim()),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function sealEntry(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(pass,salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj)));return {s:toB64(salt),i:toB64(iv),c:toB64(ct)}}
async function openEntry(e,pass){const key=await deriveKey(pass,fromB64(e.s));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(e.i)},key,fromB64(e.c));return JSON.parse(dec.decode(pt))}

function newPass(){const a="abcdefghjkmnpqrstuvwxyz23456789";const r=crypto.getRandomValues(new Uint8Array(8));const p=[...r].map(x=>a[x%a.length]).join("");return p.slice(0,4)+"-"+p.slice(4)}

  $("#today").textContent=new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  $("#navCount").textContent=S.students.size;
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===UI.view)));
  $("#crumb").textContent={overview:"Genel bakış",students:"Öğrenciler",table:"Deneme tablosu"}[UI.view];
  renderSide();
  const c=$("#content");
  const keepScroll=window.scrollY;
  if(ROLE==="student"){$("#crumb").textContent=WHO==="Veli"?"Öğrencimin gelişimi":"Gelişimim";if(S.ready&&S.mode!=="db"){c.innerHTML=viewWaiting();return}}
  if(!S.ready){c.innerHTML=`<div class="card empty"><h3>Kayıtlar yükleniyor</h3><p>Öğrenciler ve deneme sonuçları birazdan burada.</p></div>`;return}

}
function renderSide(){
  const q=UI.sq.toLocaleLowerCase("tr-TR");
  const list=studentsSorted().filter(s=>!q||s.name.toLocaleLowerCase("tr-TR").includes(q));
  $("#slist").innerHTML=list.length?list.map(s=>`<button class="sitem" data-sid="${s.id}" aria-current="${s.id===UI.sid}"><span class="av">${esc(initials(s.name))}</span><span class="meta"><div class="nm">${esc(s.name)}</div><div class="sub">${esc(s.level||"Öğrenci")} · ${examsOf(s.id).length} deneme</div></span></button>`).join(""):`<div style="padding:8px;font-size:13px;color:var(--muted)">${S.students.size?"Eşleşen öğrenci yok.":"Henüz öğrenci yok."}</div>`}

function typeBar(active,attr="data-type",types=Object.keys(TYPES)){return `<div class="seg" role="group" aria-label="Sınav türü">${types.map(t=>`<button ${attr}="${t}" aria-pressed="${t===active}">${t}</button>`).join("")}</div>`}

  <div class="typebar">${typeBar(UI.type,"data-type",typesOf(s))}<span class="hint">${T.label} sonuçları · varsayılan ${DIV_LABEL[T.div]}${otherTypes.length?` · ${otherTypes.map(t=>`<button class="linkish" data-type="${t}">${t}: ${examsOf(s.id,t).length} kayıt</button>`).join(", ")}`:""}</span></div>

    <div class="who"><div class="n">${esc(s.name)}<button class="icon-btn teach" data-act="edit-student" data-id="${s.id}" aria-label="Öğrenciyi düzenle">${ICON.edit}</button></div>
    <div class="s">${ro?`<span>${esc(s.level||"Öğrenci")}</span>`:`<button class="linkish" data-act="edit-student" data-id="${s.id}">${s.level?esc(s.level):"Sınıf bilgisi ekle"}</button>`}<span>·</span><span>${TRACKS[trackOf(s)].label}</span><span>·</span><span>${list.length} ${T.label} deneme kaydı</span>${s.note&&!ro?`<span>·</span><span>${esc(s.note)}</span>`:""}</div></div>
    ${ro&&target?`<span class="badge">${ICON.target}Hedef: ${fmt(target)} net</span>`:""}
    <button class="btn sm" data-act="karne"><svg class="ico" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Excel karnesi</button>
    <button class="btn sm teach" data-act="access">${codesOf(s).length?`<span class="badge on" style="padding:0 6px">● ${codesOf(s).length}</span>Öğrenci ve veli erişimi`:"Öğrenci ve veli erişimi"}</button>
    <button class="btn sm teach" data-act="target">${ICON.target}${target?`Hedef: ${fmt(target)} net`:"Net hedefi belirle"}</button>

  </div>`;
  if(!list.length)return h+`<div class="card empty"><h3>${esc(s.name)} için ${T.label} denemesi yok</h3><p>${ro?"Öğretmenin bir sonuç girdiğinde netlerin, grafik ve ders ortalamaların burada görünür.":"İlk sonucu girdiğinde netler, grafik ve ders ortalamaları burada görünür."}</p><button class="btn primary teach" data-act="add-exam">${ICON.plus}Deneme ekle</button><button class="btn primary ro-only" data-act="submit-exam">${ICON.plus}Sonuç gönder</button></div>`;
  const complete=list.filter(e=>!missingSubs(e)).length;

    <div class="card kpi"><div class="k">Son deneme neti<span class="kico">${ICON.trend}</span></div><div class="v num">${fmt(sm?.last)}<small>net</small></div><div class="f">${sm?.prev!=null?deltaChip(sm.last-sm.prev)+" önceki denemeye göre":"İlk kayıt"}</div></div>
    <div class="card kpi"><div class="k">Ortalama net<span class="kico">${ICON.bars}</span></div><div class="v num">${fmt(sm?.avg)}<small>net</small></div><div class="f">${target?`<span style="flex:1">Hedefe ${fmt(Math.max(0,target-(sm?.avg||0)))} net kaldı</span><div class="meter" style="flex-basis:100%"><i style="width:${Math.min(100,(sm?.avg||0)/target*100)}%"></i></div>`:`${sm?.n||0} denemenin ortalaması`}</div></div>
    <div class="card kpi"><div class="k">En yüksek net<span class="kico" style="color:var(--gold)">${ICON.trophy}</span></div><div class="v num">${fmt(sm?.bestNet)}<small>net</small></div><div class="f"><span class="chip gold">${esc(sm?.best?.name||"")}</span>${sm?.best?.date?fdate(sm.best.date):""}</div></div>
    <div class="card kpi"><div class="k">Kaydedilen deneme<span class="kico">${ICON.doc}</span></div><div class="v num">${String(list.length).padStart(2,"0")}<small>deneme</small></div><div class="f">${complete===list.length?"✓ Tüm ders ayrıntıları tamam":`${list.length-complete} denemede eksik ders alanı`}</div></div>
  </div>
  <div class="grid2">
    <section class="card pad"><div class="card-h"><div><h2>Net gelişimi</h2><p>Tarihe göre, eskiden yeniye</p></div><span class="chip flat">${chrono(list).length} deneme</span></div>
      <div class="legend" id="legend"><button data-series="total" aria-pressed="${!!UI.series.total}"><i style="background:var(--c-total)"></i>Genel net</button>${T.secs.map(sc=>`<button data-series="${sc.key}" aria-pressed="${!!UI.series[sc.key]}"><i style="background:var(${sc.color})"></i>${sc.name}</button>`).join("")}</div>

    <section class="card pad"><div class="card-h"><div><h2>Ders ortalamaları</h2><p>Kayıtlı denemeler üzerinden</p></div></div>
      <div class="subjects">${T.secs.map(sc=>{const vals=chrono(list).map(e=>secNet(e,sc)).filter(v=>v!=null);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;const d=vals.length>1?vals.at(-1)-vals.at(-2):null;
        return `<div class="subj"><span class="tag" style="background:color-mix(in srgb,var(${sc.color}) 14%,transparent);color:var(${sc.color})">${sc.tag}</span><div><div class="nm">${sc.name}</div><div class="av2 num"><b>${fmt(avg)}</b>ortalama net</div></div><div class="rt">${spark(vals,sc.color)}${deltaChip(d)}</div></div>`}).join("")}</div>
      <div class="foot-note">Değişimler son iki denemeyi karşılaştırır.</div></section>
  </div>

  return h}

function spark(vals,color){if(vals.length<2)return `<svg class="spark" width="72" height="24" aria-hidden="true"></svg>`;const mx=Math.max(...vals),mn=Math.min(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[2+i*(68/(vals.length-1)),21-(v-mn)/rg*18]);const p=pts.map(q=>q.map(r2).join(",")).join(" ");const last=pts.at(-1);
  return `<svg class="spark" width="72" height="24" viewBox="0 0 72 24" aria-hidden="true"><polyline points="${p}" fill="none" stroke="var(${color})" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${r2(last[0])}" cy="${r2(last[1])}" r="2.4" fill="var(${color})"/></svg>`}

function examTable(list,T,s){
  const q=UI.q.toLocaleLowerCase("tr-TR");
  const rows=sortExams(list,UI.sort).filter(e=>!q||e.name.toLocaleLowerCase("tr-TR").includes(q));
  const avgSec=T.secs.map(sc=>{const v=list.map(e=>secNet(e,sc)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null});
  const tv=list.map(totalNet).filter(x=>x!=null);const avgT=tv.length?tv.reduce((a,b)=>a+b,0)/tv.length:null;
  return `<section class="card pad" id="results"><div class="card-h"><div><h2>Deneme sonuçları <span class="chip flat num">${list.length}</span></h2><p>Doğru, yanlış ve netleri tek yerde takip et.</p></div>
    <div class="tbl-tools"><label class="search" for="eq" style="width:180px"><svg class="ico" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><input id="eq" placeholder="Deneme ara…" value="${esc(UI.q)}" autocomplete="off"></label>
    <select class="pick" id="sortSel" aria-label="Sıralama"><option value="asc" ${UI.sort==="asc"?"selected":""}>Tarih: eskiden yeniye</option><option value="desc" ${UI.sort==="desc"?"selected":""}>Tarih: yeniden eskiye</option><option value="added" ${UI.sort==="added"?"selected":""}>Kayıt sırası</option></select>
    <div class="seg sm" role="group" aria-label="Görünüm"><button data-dyn="0" aria-pressed="${!UI.dyn}">Özet</button><button data-dyn="1" aria-pressed="${UI.dyn}">D / Y / Net</button></div></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Deneme</th>${T.secs.map(sc=>`<th><span class="sw" style="background:var(${sc.color})"></span>${sc.name}<small>${UI.dyn?"D · Y · Net":"Toplam net"}</small></th>`).join("")}<th class="tot">Genel net</th><th class="teach"><span hidden>İşlemler</span></th></tr></thead>
    <tbody>${rows.length?rows.map((e,i)=>examRow(e,T,i)).join(""):`<tr><td colspan="${T.secs.length+3}" style="text-align:center;color:var(--muted);padding:28px">Aramayla eşleşen deneme yok.</td></tr>`}</tbody>
    <tfoot><tr><td>Ortalama</td>${avgSec.map(a=>`<td class="num">${fmt(a)}</td>`).join("")}<td class="tot num">${fmt(avgT)}</td><td class="teach"></td></tr></tfoot></table></div>
    <div class="tbl-foot"><span>Ders ayrıntıları için D / Y / Net görünümünü seç. Tarihi olmayan denemeler en sonda gösterilir. <span class="ovr">●</span> elle girilmiş bölüm neti.</span><button class="btn quiet sm" data-act="csv">CSV indir</button></div></section>`}

function examRow(e,T,i){
  const cells=T.secs.map(sc=>{const n=secNet(e,sc);const o=isNum(e.overrides?.[sc.key]);
    if(!UI.dyn)return `<td class="num">${fmt(n)}${o?'<span class="ovr" title="Elle girilmiş bölüm neti">●</span>':""}</td>`;
    const {c,w}=secCW(e,sc);
    return `<td><span class="dyn num"><span class="d">${c??"—"}</span><span class="y">${w??"—"}</span><span class="n">${fmt(n)}${o?'<span class="ovr">●</span>':""}</span></span></td>`}).join("");
  const conf=UI.confirm===e.id;
  return `<tr><td><div class="ex" style="display:flex;gap:12px;align-items:center"><span class="idx num">${String(i+1).padStart(2,"0")}</span><div><div class="nm">${esc(e.name)}${overLimit(e)?` <span class="chip down" title="${esc(overLimit(e))}">soru sayısı aşılmış</span>`:""}</div><div class="dt">${fdate(e.date)} · ${DIV_LABEL[e.divisor]??""}${e.note?` · <span title="${esc(e.note)}">not var</span>`:""}</div></div></div></td>${cells}<td class="tot num">${fmt(totalNet(e))}</td>
    <td class="teach"><div class="acts">${conf?`<span class="confirm-inline"><button class="btn danger sm" data-act="del-exam-yes" data-id="${e.id}">Sil</button><button class="btn quiet sm" data-act="cancel">Vazgeç</button></span>`:`<button class="icon-btn" data-act="edit-exam" data-id="${e.id}" aria-label="${esc(e.name)} düzenle">${ICON.edit}</button><button class="icon-btn" data-act="del-exam" data-id="${e.id}" aria-label="${esc(e.name)} sil">${ICON.trash}</button>`}</div></td></tr>`}

function drawChart(){
  const el=$("#chart");if(!el)return;const s=currentStudent();const T=TYPES[UI.type];
  const list=chrono(examsOf(s.id,UI.type));
  const series=[];if(UI.series.total)series.push({key:"total",name:"Genel net",color:"--c-total",vals:list.map(totalNet),w:2.4});
  T.secs.forEach(sc=>{if(UI.series[sc.key])series.push({key:sc.key,name:sc.name,color:sc.color,vals:list.map(e=>secNet(e,sc)),w:1.8})});
  const W=Math.max(320,el.clientWidth||640),H=Math.round(Math.min(300,Math.max(220,W*.42)));const P={l:34,r:14,t:14,b:30};
  const target=s.targets?.[UI.type];
  let mx=Math.max(1,...series.flatMap(x=>x.vals.filter(v=>v!=null)),target||0);let mn=Math.min(0,...series.flatMap(x=>x.vals.filter(v=>v!=null)));
  const step=[1,2,5,10,20,25,50].find(st=>(mx-mn)/st<=5)||100;mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;
  const n=list.length;const X=i=>n<2?P.l+(W-P.l-P.r)/2:P.l+i*(W-P.l-P.r)/(n-1);const Y=v=>P.t+(mx-v)/(mx-mn)*(H-P.t-P.b);
  let g="";for(let v=mn;v<=mx+1e-9;v+=step){g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="${v===0?"":"3 4"}"/><text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  const every=Math.ceil(n/Math.max(2,Math.floor((W-P.l-P.r)/78)));
  list.forEach((e,i)=>{if(i%every===0||i===n-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="${n>1&&i===0?"start":n>1&&i===n-1?"end":"middle"}">${i+1}. deneme</text>`});
  if(target)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="6 5"/><text x="${W-P.r}" y="${Y(target)-6}" text-anchor="end" style="fill:var(--gold)">hedef ${fmt(target)}</text>`;
  series.forEach(sr=>{const pts=sr.vals.map((v,i)=>v==null?null:[X(i),Y(v)]);const segs=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
    if(sr.key==="total"&&segs.length===1&&segs[0].length>1){const sg=segs[0];g+=`<path d="M${sg.map(p=>p.join(",")).join("L")}L${sg.at(-1)[0]},${Y(Math.max(mn,0))}L${sg[0][0]},${Y(Math.max(mn,0))}Z" fill="var(--c-total)" opacity=".08"/>`}
    segs.forEach(sg=>{g+=`<polyline points="${sg.map(p=>p.map(r2).join(",")).join(" ")}" fill="none" stroke="var(${sr.color})" stroke-width="${sr.w}" stroke-linejoin="round" stroke-linecap="round"/>`});
    pts.forEach((p,i)=>{if(p)g+=`<circle cx="${r2(p[0])}" cy="${r2(p[1])}" r="${i===n-1?4.5:3.5}" fill="${i===n-1?`var(${sr.color})`:"var(--panel)"}" stroke="var(${sr.color})" stroke-width="2"/>`})});
  list.forEach((e,i)=>{const x0=n<2?P.l:(X(i)+X(Math.max(0,i-1)))/2,x1=n<2?W-P.r:(X(i)+X(Math.min(n-1,i+1)))/2;g+=`<rect class="hit" data-i="${i}" x="${i===0?P.l:x0}" y="${P.t}" width="${Math.max(1,(i===n-1?W-P.r:x1)-(i===0?P.l:x0))}" height="${H-P.t-P.b}" fill="transparent"/>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net gelişimi grafiği">${g}</svg><div class="tip" id="tip" hidden></div>`;
  const tip=$("#tip");
  el.querySelectorAll(".hit").forEach(r=>{const show=()=>{const i=+r.dataset.i,e=list[i];const top=Math.min(...series.map(sr=>sr.vals[i]).filter(v=>v!=null).map(Y),H-P.b);
      tip.innerHTML=`<b>${esc(e.name)}</b><div style="color:var(--muted);margin-bottom:6px">${i+1}. deneme · ${fdate(e.date)}</div><div class="r"><span><i class="dot" style="margin:0;background:var(--c-total)"></i>Genel net</span><b class="num" style="display:inline">${fmt(totalNet(e))}</b></div>${T.secs.map(sc=>`<div class="r"><span><i class="dot" style="margin:0;background:var(${sc.color})"></i>${sc.name}</span><span class="num">${fmt(secNet(e,sc))}</span></div>`).join("")}`;
      const sx=el.clientWidth/W;let left=X(i)*sx;left=Math.max(95,Math.min(el.clientWidth-95,left));tip.style.left=left+"px";tip.style.top=(isFinite(top)?top*sx:20)+"px";tip.hidden=false};
    r.addEventListener("mouseenter",show);r.addEventListener("click",show);r.addEventListener("mouseleave",()=>tip.hidden=true)})}

      <div><div class="n">${esc(s.name)}</div><div class="lv">${esc(s.level||"Sınıf bilgisi eklenmemiş")} · ${trackOf(s)}${codesOf(s).length?` · <span class="badge on" style="padding:0 6px">${codesOf(s).map(a=>a.who).join(" + ")}</span>`:""}</div></div>

function examModal(ex,mode="edit"){

  const editing=mode==="edit"&&!!ex;if(!ex)fitType(s);const st={id:editing?ex.id:uid(),studentId:s.id,type:ex?.type||UI.type,name:ex?.name||"",date:ex?ex.date||"":isoToday(),divisor:ex?ex.divisor:TYPES[ex?.type||UI.type].div,results:JSON.parse(JSON.stringify(ex?.results||{})),overrides:{...(ex?.overrides||{})},note:ex?.note||"",extra:ex?.extra||"",createdAt:editing?ex.createdAt||Date.now():Date.now()};

      ${sc.subs.map(sb=>{const r=st.results[sb.key]||{};return `<div class="srow"><span>${sb.name}<small>${sb.max} soru</small></span><input inputmode="numeric" maxlength="2" id="c_${sb.key}" data-k="${sb.key}" data-f="c" data-max="${sb.max}" value="${isNum(r.c)?r.c:""}" placeholder="—" aria-label="${sb.name} doğru"><input inputmode="numeric" maxlength="2" id="w_${sb.key}" data-k="${sb.key}" data-f="w" data-max="${sb.max}" value="${isNum(r.w)?r.w:""}" placeholder="—" aria-label="${sb.name} yanlış"><span class="nn" data-subnet="${sb.key}">—</span></div>`}).join("")}
      <div class="ovr-row"><label for="o_${sc.key}">Bölüm netini elle gir</label><input id="o_${sc.key}" data-ovr="${sc.key}" inputmode="decimal" value="${isNum(st.overrides[sc.key])?String(st.overrides[sc.key]).replace(".",","):""}" placeholder="otomatik"><span>Alt ders dağılımı yoksa kullan.</span></div></div>`).join("")};
  openModal(`<div class="m-h"><div><h2>${mode==="import"?"Gelen sonucu kontrol et":mode==="submit"?"Sonuç gönder":editing?"Denemeyi düzenle":"Yeni deneme sonucu"}</h2><p>${mode==="import"?"Sayıları kontrol et, gerekirse düzelt ve kaydet.":mode==="submit"?`${esc(s.name)} için doğru ve yanlış sayılarını gir; mesaj olarak öğretmene gidecek.`:`${esc(s.name)} için doğru ve yanlış sayılarını gir.`}</p></div><button class="icon-btn" data-act="close" aria-label="Kapat">✕</button></div>
    <form class="m-b" id="exForm" novalidate>
      <div class="fields"><div class="fld"><label for="f_type">Sınav türü</label><select id="f_type">${[...new Set([...typesOf(s),st.type])].map(t=>`<option ${t===st.type?"selected":""}>${t}</option>`).join("")}</select></div>
        <div class="fld"><label for="f_name">Deneme adı</label><input id="f_name" value="${esc(st.name)}" placeholder="Örn. Türkiye Geneli 1" autofocus></div>
        <div class="fld"><label for="f_date">Tarih<small>isteğe bağlı</small></label><input type="date" id="f_date" value="${st.date}"></div>
        <div class="fld"><label for="f_div">Net hesabı</label><select id="f_div">${[4,3,0].map(d=>`<option value="${d}" ${+st.divisor===d?"selected":""}>${DIV_LABEL[d]}</option>`).join("")}</select></div>
        ${(editing||mode==="import")&&S.students.size>1?`<div class="fld"><label for="f_stu">Öğrenci</label><select id="f_stu">${studentsSorted().map(x=>`<option value="${x.id}" ${x.id===st.studentId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>`:""}</div>
      <div class="notice"><span>Sayı girmediğin alanlar boş kalır. Gerçek bir sıfır için <b>0</b> yaz.</span><button type="button" class="btn sm" id="fillZero">Boş alanları 0 ile tamamla</button></div>
      <div class="secs" id="secs">${body()}</div>
      <div class="fld"><label for="f_note">Deneme notu<small>isteğe bağlı</small></label><textarea id="f_note" placeholder="Örn. süre yetmedi, paragraf soruları zorladı">${esc(st.note)}</textarea></div>
      <p class="err" id="f_err" hidden></p>
    </form>
    <div class="m-f"><span class="sum">Genel toplam <b class="num" id="f_total">—</b>net<br><small id="f_miss"></small></span><button class="btn quiet" data-act="close">Vazgeç</button><button class="btn primary" id="f_save">${mode==="submit"?"Mesajı hazırla":"✓ Sonucu kaydet"}</button></div>`);
  const recalc=()=>{const T=TYPES[st.type];let bad=false;const probs=new Set();
    document.querySelectorAll("#secs input[data-k]").forEach(inp=>{const k=inp.dataset.k;const r=st.results[k]||{};const max=+inp.dataset.max;const c=+r.c||0,w=+r.w||0;const b=(inp.value!==""&&!/^\d+$/.test(inp.value))||c+w>max;inp.classList.toggle("bad",b);if(b){bad=true;const nm=T.secs.flatMap(sc=>sc.subs).find(x=>x.key===k);probs.add(`${nm.name}: doğru + yanlış en fazla ${max}`)}});
    const fe=$("#f_err");if(probs.size){fe.textContent=[...probs].join(" · ");fe.hidden=false}else if(fe.dataset.lim!=="0"){fe.hidden=true}
    T.secs.forEach(sc=>{sc.subs.forEach(sb=>{const n=subNet(st.results[sb.key],st.divisor);const el=document.querySelector(`[data-subnet="${sb.key}"]`);if(el)el.textContent=fmt(n)});const el=document.querySelector(`[data-secnet="${sc.key}"]`);if(el)el.textContent=fmt(secNet(st,sc))+" net"+(isNum(st.overrides[sc.key])?" (elle)":"")});

  const form=$("#exForm");

    if(t.dataset.k){const r=st.results[t.dataset.k]||(st.results[t.dataset.k]={c:null,w:null});const v=t.value.trim();r[t.dataset.f]=v===""?null:(/^\d+$/.test(v)?+v:null);recalc()}
    else if(t.dataset.ovr){const v=t.value.trim().replace(",",".");if(v===""||isNaN(+v))delete st.overrides[t.dataset.ovr];else st.overrides[t.dataset.ovr]=+v;recalc()}});
  form.addEventListener("submit",e=>e.preventDefault());
  $("#f_type").addEventListener("change",e=>{st.type=e.target.value;st.divisor=TYPES[st.type].div;$("#f_div").value=String(st.divisor);$("#secs").innerHTML=body();recalc()});
  $("#f_div").addEventListener("change",e=>{st.divisor=+e.target.value;recalc()});
  $("#fillZero").addEventListener("click",()=>{TYPES[st.type].secs.forEach(sc=>sc.subs.forEach(sb=>{const r=st.results[sb.key]||(st.results[sb.key]={c:null,w:null});if(!isNum(r.c))r.c=0;if(!isNum(r.w))r.w=0}));$("#secs").innerHTML=body();recalc()});
  $("#f_save").addEventListener("click",async()=>{
    st.name=$("#f_name").value.trim();st.date=$("#f_date").value;st.note=$("#f_note").value.trim();if($("#f_stu"))st.studentId=$("#f_stu").value;
    const err=$("#f_err");
    if(!st.name){err.textContent="Deneme adını yaz; tabloda bu adla görünecek.";err.hidden=false;$("#f_name").focus();return}
    if(!recalc()){err.hidden=false;err.scrollIntoView({block:"nearest"});return}
    const keys=new Set(TYPES[st.type].secs.flatMap(sc=>sc.subs.map(sb=>sb.key)));const results={};
    for(const [k,v] of Object.entries(st.results))if(keys.has(k)&&(isNum(v?.c)||isNum(v?.w)))results[k]={c:isNum(v.c)?+v.c:null,w:isNum(v.w)?+v.w:null};
    const secKeys=new Set(TYPES[st.type].secs.map(sc=>sc.key));const overrides={};for(const [k,v] of Object.entries(st.overrides))if(secKeys.has(k))overrides[k]=v;
    const data={studentId:st.studentId,type:st.type,name:st.name,date:st.date||"",divisor:+st.divisor,results,overrides,note:st.note,extra:st.extra,createdAt:st.createdAt,updatedAt:Date.now()};
    if(mode==="submit"){closeModal();shareModal(data,s.name);return}
    closeModal();UI.type=st.type;UI.sid=st.studentId;persistUI();
    try{await put("exams",st.id,data);toast(editing?"Deneme güncellendi.":"Deneme kaydedildi.")}catch{}});
}

async function saveFile(filename,data){if(!dl&&window.NA_STATIC){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:/\.xlsx$/.test(filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":/\.csv$/.test(filename)?"text/csv;charset=utf-8":"application/octet-stream"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();return}if(!dl){toast("Bu görünümde dosya indirilemiyor.");return}try{await dl.save({filename,data});toast("Dosya hazır.")}catch(e){if(e?.code!=="declined"&&e?.code!=="cancelled")toast("Dosya kaydedilmedi.")}}
function rowsFor(list,T,withStudent){const head=[...(withStudent?["Öğrenci"]:[]),"Deneme","Tarih","Net hesabı"];T.secs.forEach(sc=>sc.subs.forEach(sb=>head.push(`${sb.name} D`,`${sb.name} Y`,`${sb.name} Net`)));T.secs.forEach(sc=>head.push(`${sc.name} net`));head.push("Genel net","Not");
  const rows=chrono(list).map(e=>{const r=[...(withStudent?[S.students.get(e.studentId)?.name||""]:[]),e.name,e.date||"",DIV_LABEL[e.divisor]||""];T.secs.forEach(sc=>sc.subs.forEach(sb=>{const x=e.results?.[sb.key];const n=subNet(x,e.divisor);r.push(x?.c??"",x?.w??"",n==null?"":r2(n))}));T.secs.forEach(sc=>{const n=secNet(e,sc);r.push(n==null?"":r2(n))});const t=totalNet(e);r.push(t==null?"":r2(t),e.note||"");return r});
  return [head,...rows]}
function exportCSV(){const s=currentStudent();if(!s)return;const T=TYPES[UI.view==="table"?UI.tType:UI.type];
  const list=UI.view==="table"?[...S.exams.values()].filter(e=>e.type===T.label&&(UI.tStudent==="all"||e.studentId===UI.tStudent)):examsOf(s.id,T.label);
  const rows=rowsFor(list,T,UI.view==="table");const csv="﻿"+rows.map(r=>r.map(v=>{const x=typeof v==="number"?String(v).replace(".",","):String(v);return /[;"\n]/.test(x)?`"${x.replace(/"/g,'""')}"`:x}).join(";")).join("\r\n");
  saveFile(`${UI.view==="table"?"tum-ogrenciler":s.name.replace(/\s+/g,"-")}-${T.label}.csv`,csv)}
function exportXLSX(){if(!window.XLSX){toast("Excel kitaplığı yüklenemedi; CSV indirmeyi dene.");return}const wb=XLSX.utils.book_new();let any=false;
  for(const t of Object.keys(TYPES)){const list=[...S.exams.values()].filter(e=>e.type===t);if(!list.length)continue;any=true;
    const sorted=studentsSorted().flatMap(s=>chrono(list.filter(e=>e.studentId===s.id)));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rowsFor(sorted,TYPES[t],true).map((r,i)=>i?r:r)),t)}
  const ov=[["Öğrenci","Sınıf","Sınav","Deneme sayısı","Son net","Ortalama","En yüksek"]];studentsSorted().forEach(s=>Object.keys(TYPES).forEach(t=>{const sm=summary(examsOf(s.id,t));if(sm)ov.push([s.name,s.level||"",t,sm.n,r2(sm.last),r2(sm.avg),r2(sm.bestNet)])}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ov),"Özet");
  if(!any){toast("Dışa aktarılacak deneme yok.");return}
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});saveFile(`net-atlasi-${isoToday()}.xlsx`,new Uint8Array(out))}

const XL={"--c-tr":"2F6FB5","--c-mat":"7B55C4","--c-sos":"C47A1F","--c-fen":"2B9A74","--c-ink":"C2453A","--c-din":"8A6A3C","--c-ing":"C24B8F"};
const tint=(hex,a)=>{const n=parseInt(hex,16);const m=c=>Math.round(c+(255-c)*(1-a)).toString(16).padStart(2,"0");return "FF"+m(n>>16)+m((n>>8)&255)+m(n&255)};
async function exportKarne(){const s=currentStudent();if(!s){toast("Önce bir öğrenci seç.");return}
  if(!window.ExcelJS){toast("Excel kitaplığı yüklenemedi; sayfayı yenileyip tekrar dene.");return}
  const types=[...new Set([...typesOf(s),...Object.keys(TYPES).filter(t=>examsOf(s.id,t).length)])].filter(t=>examsOf(s.id,t).length);
  if(!types.length){toast("Henüz kayıtlı deneme yok.");return}
  const INK="FF16443A",LINE="FFDBE2DF",MUTED="FF5D6B66",ZEBRA="FFF6F8F7",GOLD="FFB07A12";
  const thin={style:"thin",color:{argb:LINE}};const box={top:thin,bottom:thin,left:thin,right:thin};
  const wb=new ExcelJS.Workbook();wb.creator="Net Atlası";wb.created=new Date();
  const today=new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  /* Özet */
  const ws=wb.addWorksheet("Özet",{views:[{showGridLines:false}],pageSetup:{orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0}});
  ws.columns=[{width:24},{width:13},{width:13},{width:13},{width:13},{width:26},{width:15}];
  ws.mergeCells("A1:G1");Object.assign(ws.getCell("A1"),{value:`${s.name} · Deneme Karnesi`,font:{size:18,bold:true,color:{argb:INK}}});ws.getRow(1).height=30;
  ws.mergeCells("A2:G2");Object.assign(ws.getCell("A2"),{value:[s.level,TRACKS[trackOf(s)].label,`Hazırlanma: ${today}`].filter(Boolean).join("  ·  "),font:{color:{argb:MUTED}}});
  let r=4;
  const head=(row,vals,fill=INK)=>{vals.forEach((v,i)=>{const c=ws.getCell(row,i+1);c.value=v;c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:fill}};c.alignment={vertical:"middle",horizontal:i?"center":"left",wrapText:true};c.border=box});ws.getRow(row).height=22};
  head(r++,["Sınav","Deneme sayısı","Son net","Ortalama","En yüksek","En yüksek deneme","Son değişim"]);
  for(const t of types){const sm=summary(examsOf(s.id,t));if(!sm)continue;const vals=[t,sm.n,r2(sm.last),r2(sm.avg),r2(sm.bestNet),sm.best.name,sm.prev!=null?r2(sm.last-sm.prev):null];
    vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;c.border=box;c.alignment={horizontal:i?"center":"left"};if(i>=2&&i!==5)c.numFmt="0.##";if(i===4)c.font={bold:true,color:{argb:GOLD}};if(i===6&&v!=null)c.font={bold:true,color:{argb:v>=0?"FF1F7A4D":"FFB4442C"}};if(i===6&&v!=null)c.numFmt='+0.##;-0.##;0'});r++}
  for(const t of types){const T=TYPES[t];const list=chrono(examsOf(s.id,t));r++;
    ws.mergeCells(r,1,r,7);Object.assign(ws.getCell(r,1),{value:`${t} · ders ortalamaları`,font:{bold:true,size:13,color:{argb:INK}}});r++;
    head(r++,["Ders","Ortalama net","Son net","En yüksek","Son değişim","Soru sayısı",""]);
    for(const sc of T.secs){const v=list.map(e=>secNet(e,sc)).filter(x=>x!=null);if(!v.length)continue;const col=XL[sc.color];
      const vals=[sc.name,r2(v.reduce((a,b)=>a+b,0)/v.length),r2(v.at(-1)),r2(Math.max(...v)),v.length>1?r2(v.at(-1)-v.at(-2)):null,sc.subs.reduce((a,b)=>a+b.max,0),null];
      vals.slice(0,6).forEach((x,i)=>{const c=ws.getCell(r,i+1);c.value=x;c.border=box;c.alignment={horizontal:i?"center":"left"};if(i&&i<5)c.numFmt="0.##";if(i===4&&x!=null){c.numFmt='+0.##;-0.##;0';c.font={color:{argb:x>=0?"FF1F7A4D":"FFB4442C"}}}});
      ws.getCell(r,1).fill={type:"pattern",pattern:"solid",fgColor:{argb:tint(col,.16)}};ws.getCell(r,1).font={bold:true,color:{argb:"FF"+col}};r++}}
  /* sınav türü sayfaları */
  for(const t of types){const T=TYPES[t];const list=chrono(examsOf(s.id,t));
    const sh=wb.addWorksheet(t,{views:[{state:"frozen",xSplit:2,ySplit:3,showGridLines:false}],pageSetup:{orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0}});
    const cols=[{key:"name",w:24},{key:"date",w:12}];
    T.secs.forEach(sc=>{sc.subs.forEach(sb=>{cols.push({sec:sc,sub:sb,f:"c",w:5.5},{sec:sc,sub:sb,f:"w",w:5.5},{sec:sc,sub:sb,f:"n",w:7})});cols.push({sec:sc,f:"sec",w:9})});
    cols.push({f:"tot",w:10},{f:"note",w:40});sh.columns=cols.map(c=>({width:c.w}));
    sh.mergeCells(1,1,1,cols.length);Object.assign(sh.getCell(1,1),{value:`${s.name} · ${t} denemeleri`,font:{size:15,bold:true,color:{argb:INK}}});sh.getRow(1).height=26;
    const H1=2,H2=3;let ci=3;
    for(const sc of T.secs){const col=XL[sc.color];const span=sc.subs.length*3+1;sh.mergeCells(H1,ci,H1,ci+span-1);
      const c=sh.getCell(H1,ci);c.value=sc.name;c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF"+col}};c.alignment={horizontal:"center",vertical:"middle"};
      for(const sb of sc.subs){["D","Y","Net"].forEach((lab,i)=>{const h=sh.getCell(H2,ci+i);h.value=sc.subs.length>1?`${sb.name}\n${lab}`:lab;h.font={bold:true,size:9,color:{argb:"FF"+col}};h.fill={type:"pattern",pattern:"solid",fgColor:{argb:tint(col,.12)}};h.alignment={horizontal:"center",vertical:"middle",wrapText:true};h.border=box});ci+=3}
      const h=sh.getCell(H2,ci);h.value=`${sc.name}\nnet`;h.font={bold:true,size:9,color:{argb:"FFFFFFFF"}};h.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF"+col}};h.alignment={horizontal:"center",vertical:"middle",wrapText:true};h.border=box;ci++}
    [["Deneme",1],["Tarih",2],["Genel net",ci],["Not",ci+1]].forEach(([v,cc])=>{sh.mergeCells(H1,cc,H2,cc);const c=sh.getCell(H1,cc);c.value=v;c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:INK}};c.alignment={horizontal:cc<=2||cc===ci+1?"left":"center",vertical:"middle"};c.border=box});
    sh.getRow(H1).height=20;sh.getRow(H2).height=T.secs.some(sc=>sc.subs.length>1)?30:18;
    let row=H2+1;
    for(const e of list){const vals=[e.name,e.date?(()=>{const [y,m,d]=e.date.split("-").map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5})():null];
      cols.slice(2).forEach(c=>{if(c.f==="c"||c.f==="w"){const x=e.results?.[c.sub.key]?.[c.f];vals.push(isNum(x)?+x:null)}else if(c.f==="n"){const n=subNet(e.results?.[c.sub.key],e.divisor);vals.push(n==null?null:r2(n))}else if(c.f==="sec"){const n=secNet(e,c.sec);vals.push(n==null?null:r2(n))}else if(c.f==="tot"){const n=totalNet(e);vals.push(n==null?null:r2(n))}else vals.push(e.note||"")});
      vals.forEach((v,i)=>{const c=sh.getCell(row,i+1);c.value=v;c.border=box;const cd=cols[i];
        if(i===1)c.numFmt="dd.mm.yyyy";if(cd.f==="n"||cd.f==="sec"||cd.f==="tot")c.numFmt="0.##";
        c.alignment={horizontal:i<2||cd.f==="note"?"left":"center",vertical:"top",wrapText:cd.f==="note"};
        if((row-H2)%2===0)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:ZEBRA}};
        if(cd.f==="c")c.font={color:{argb:"FF1F7A4D"}};if(cd.f==="w")c.font={color:{argb:"FFB4442C"}};
        if(cd.f==="sec"){c.font={bold:true,color:{argb:"FF"+XL[cd.sec.color]}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:tint(XL[cd.sec.color],.1)}}}
        if(cd.f==="tot"){c.font={bold:true,color:{argb:INK}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE1ECE8"}}}});row++}
    const avg=sh.getRow(row);avg.getCell(1).value="Ortalama";
    cols.forEach((cd,i)=>{const c=avg.getCell(i+1);c.border=box;c.font={bold:true,color:{argb:INK}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEAEEEC"}};
      if(["n","sec","tot"].includes(cd.f)&&list.length){const L=sh.getColumn(i+1).letter;c.value={formula:`IFERROR(AVERAGE(${L}${H2+1}:${L}${row-1}),"")`};c.numFmt="0.##";c.alignment={horizontal:"center"}}});
    const best=sh.getRow(row+1);best.getCell(1).value="En yüksek";const tc=ci;const L=sh.getColumn(tc).letter;
    Object.assign(best.getCell(tc),{value:{formula:`MAX(${L}${H2+1}:${L}${row-1})`},numFmt:"0.##",font:{bold:true,color:{argb:GOLD}},alignment:{horizontal:"center"}});best.getCell(1).font={bold:true,color:{argb:GOLD}};
    sh.getCell(row+3,1).value=`Net hesabı: ${[...new Set(list.map(e=>DIV_LABEL[e.divisor]))].join(", ")}. Boş hücre, o ders için sonuç girilmediği anlamına gelir.`;sh.getCell(row+3,1).font={italic:true,size:9,color:{argb:MUTED}}}
  const buf=await wb.xlsx.writeBuffer();await saveFile(`${slugify(s.name)}-deneme-karnesi.xlsx`,new Uint8Array(buf))}
function exportBackup(){const data={app:"net-atlasi",version:1,exportedAt:new Date().toISOString(),students:[...S.students.values()],exams:[...S.exams.values()]};saveFile(`net-atlasi-yedek-${isoToday()}.json`,JSON.stringify(data,null,1))}
async function restore(file){try{const d=JSON.parse(await file.text());if(!Array.isArray(d.students)||!Array.isArray(d.exams))throw 0;
    let n=0;for(const s of d.students){const {id,...rest}=s;if(id&&rest.name){await put("students",id,rest);n++}}for(const e of d.exams){const {id,...rest}=e;if(id&&rest.studentId&&TYPES[rest.type]){await put("exams",id,rest);n++}}toast(`${n} kayıt geri yüklendi.`)}
  catch{toast("Bu dosya bir Net Atlası yedeği değil.")}}

/* ---------- olaylar ---------- */
function persistUI(){ls.set("na-view",UI.view);ls.set("na-sid",UI.sid);ls.set("na-type",UI.type);ls.set("na-sort",UI.sort);ls.set("na-ttype",UI.tType)}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function go(view){UI.view=view;UI.confirm=null;UI.menu=null;persistUI();$("#side").classList.remove("open");window.scrollTo(0,0);render()}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-act]");
  if(!e.target.closest(".menu-wrap")){if(!$("#dataMenu").hidden){$("#dataMenu").hidden=true;$("#dataBtn").setAttribute("aria-expanded","false")}if(UI.menu&&!b?.dataset.act){UI.menu=null;UI.confirm=null;render()}}
  if(e.target.id==="scrim"){closeModal();return}
  if(!b)return;
  if(b.dataset.view)return go(b.dataset.view);
  if(b.id==="copyCode"){const t=$("#myCode").textContent;navigator.clipboard?.writeText(t).then(()=>toast("Kod kopyalandı.")).catch(()=>{getSelection().selectAllChildren($("#myCode"));toast("Kodu seçtim; kopyalayıp gönder.")});return}
  if(b.dataset.sid){UI.sid=b.dataset.sid;UI.q="";fitType(S.students.get(UI.sid));persistUI();go("overview");return}
  if(b.dataset.type&&!b.dataset.act){UI.type=b.dataset.type;persistUI();render();return}
  if(b.dataset.ttype){UI.tType=b.dataset.ttype;persistUI();render();return}
  if(b.dataset.series){UI.series[b.dataset.series]=!UI.series[b.dataset.series];if(!Object.values(UI.series).some(Boolean))UI.series.total=true;render();return}
  if(b.dataset.dyn){UI.dyn=b.dataset.dyn==="1";render();return}
  const id=b.dataset.id;
  switch(b.dataset.act){
    case "add-exam":return examModal(null);
    case "edit-exam":return examModal(S.exams.get(id));
    case "del-exam":UI.confirm=id;return render();
    case "del-exam-yes":UI.confirm=null;return del("exams",id).then(()=>toast("Deneme silindi.")).catch(()=>{});
    case "cancel":UI.confirm=null;return render();
    case "add-student":return studentModal(null);
    case "edit-student":UI.menu=null;return studentModal(S.students.get(id));
    case "smenu":UI.menu=UI.menu===id?null:id;UI.confirm=null;return render();
    case "del-student":UI.confirm=id;return render();
    case "del-student-yes":{UI.menu=null;UI.confirm=null;const ex=examsOf(id);(async()=>{try{for(const x of ex)await del("exams",x.id);await del("students",id);if(UI.sid===id)UI.sid=null;toast("Öğrenci ve denemeleri silindi.");render()}catch{}})();return}
    case "open-student":UI.sid=id;UI.type=b.dataset.type||primaryType(id);fitType(S.students.get(id));persistUI();return go("overview");
    case "target":return targetModal();
    case "access":return accessModal();
    case "import":return importModal();
    case "karne":$("#dataMenu").hidden=true;return exportKarne();
    case "github":$("#dataMenu").hidden=true;return githubModal();
    case "logout":ls.set("na-login",null);S.mode="login";S.students.clear();S.exams.clear();render();return;
    case "submit-exam":return examModal(null,"submit");
    case "close":return closeModal();
    case "csv":$("#dataMenu").hidden=true;return exportCSV();
    case "xlsx":$("#dataMenu").hidden=true;return exportXLSX();
    case "backup":$("#dataMenu").hidden=true;return exportBackup();
  }
});
$("#dataBtn").addEventListener("click",()=>{const m=$("#dataMenu");m.hidden=!m.hidden;$("#dataBtn").setAttribute("aria-expanded",String(!m.hidden))});
$("#restoreFile").addEventListener("change",e=>{const f=e.target.files[0];$("#dataMenu").hidden=true;if(f)restore(f);e.target.value=""});
$("#addStudentSide").addEventListener("click",()=>studentModal(null));
$("#helpBtn").addEventListener("click",helpModal);
$("#menuBtn").addEventListener("click",()=>$("#side").classList.toggle("open"));
$("#sq").addEventListener("input",e=>{UI.sq=e.target.value;renderSide()});
document.addEventListener("input",e=>{const t=e.target;
  const keep=(fn)=>{const pos=t.selectionStart;fn();render();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch{}}};
  if(t.id==="eq")keep(()=>UI.q=t.value);else if(t.id==="tq")keep(()=>UI.tq=t.value);else if(t.id==="sq2")keep(()=>{UI.sq=t.value;$("#sq").value=t.value})});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="pickStudent"){UI.sid=t.value;fitType(S.students.get(UI.sid));persistUI();render()}
  else if(t.id==="sortSel"){UI.sort=t.value;persistUI();render()}
  else if(t.id==="tStud"){UI.tStudent=t.value;render()}});
document.addEventListener("submit",e=>{if(e.target.id==="lgForm"){e.preventDefault();const b=$("#lg_go");b.disabled=true;b.textContent="Açılıyor…";tryLogin($("#lg_user").value,$("#lg_pass").value,$("#lg_who").value,false).finally(()=>{const x=$("#lg_go");if(x){x.disabled=false;x.textContent="Giriş yap"}})}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modalRoot").innerHTML)closeModal();else{$("#dataMenu").hidden=true;$("#side").classList.remove("open")}}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawChart,120)});
window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener?.("change",drawChart);
boot();
</script>

</body></html>
